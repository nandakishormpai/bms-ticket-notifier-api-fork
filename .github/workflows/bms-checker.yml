name: BMS Ticket Checker

on:
  schedule:
    # UTC: minutes 04, 09, 14, ... 59. Scheduled runs may be delayed by GitHub.
    - cron: '4-59/5 * * * *'
  workflow_dispatch:  # Manual runs behave exactly like scheduled runs

concurrency:
  group: bms-ticket-checker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run checker
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          BMS_TRACKS: ${{ vars.BMS_TRACKS }}
        run: uv run main.py

      - name: Commit updated state
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          files=(bms_state*.json)
          if (( ${#files[@]} )); then
            git add -- "${files[@]}"
            if ! git diff --cached --quiet; then
              git commit -m "chore: update state files [skip ci]"
              git pull --rebase
              git push
            fi
          fi
